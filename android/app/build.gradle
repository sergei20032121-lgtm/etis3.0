import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

// Версия приложения = версия расширения из manifest.json
def manifestJson = new JsonSlurper().parse(rootProject.file('../manifest.json'))
def appVersion = manifestJson.version as String
def parts = appVersion.tokenize('.').collect { it as int }
def appVersionCode = parts[0] * 10000 + parts[1] * 100 + parts[2]

android {
    namespace 'ru.komar.etis3'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.komar.etis3'
        minSdk 24
        targetSdk 35
        versionCode appVersionCode
        versionName appVersion
    }

    // Подпись релиза — только ключом из секретов CI (ETIS3_KEYSTORE и пароли).
    // Публичного «запасного» ключа больше нет: без секретов релиз не подписывается вовсе.
    def releaseKeystore = System.getenv('ETIS3_KEYSTORE')
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('ETIS3_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ETIS3_KEY_ALIAS') ?: 'etis3'
                keyPassword System.getenv('ETIS3_KEY_PASSWORD') ?: System.getenv('ETIS3_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystore) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs += [file('build/generated/etis3-assets')]
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// Свежий userscript (dist/etis3.user.js) кладём в assets при каждой сборке
def copyUserscript = tasks.register('copyUserscript', Copy) {
    from rootProject.file('../dist/etis3.user.js')
    into file('build/generated/etis3-assets')
}
tasks.named('preBuild') { dependsOn copyUserscript }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'org.jsoup:jsoup:1.17.2'
    testImplementation 'junit:junit:4.13.2'
}
