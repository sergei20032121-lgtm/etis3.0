# Сборка Android-приложения ЕТИС 3.0 (WebView + встроенный userscript).
# Запускается при изменениях в android/, dist/ или manifest.json на main,
# публикует APK в релиз vX.Y.Z (и как артефакт сборки).
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'dist/**'
      - 'manifest.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Свой ключ подписи можно задать секретами репозитория; без них — публичный ключ из android/
      - name: Ключ подписи из секретов (если задан)
        env:
          KEYSTORE_B64: ${{ secrets.ETIS3_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ETIS3_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Сборка APK
        working-directory: android
        env:
          ETIS3_KEYSTORE_PASSWORD: ${{ secrets.ETIS3_KEYSTORE_PASSWORD }}
          ETIS3_KEY_ALIAS: ${{ secrets.ETIS3_KEY_ALIAS }}
          ETIS3_KEY_PASSWORD: ${{ secrets.ETIS3_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Версия
        id: v
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Файлы
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/etis3.apk
          cp out/etis3.apk "out/etis3-${{ steps.v.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: etis3-apk-${{ steps.v.outputs.version }}
          path: out/*.apk

      - name: Релиз на GitHub
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          NOTES="ЕТИС 3.0 для Android. Скачайте etis3.apk и установите (разрешите установку из этого источника). Скрипт внутри приложения обновляется сам."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
          else
            gh release create "$TAG" out/*.apk --title "ЕТИС 3.0 $TAG" --notes "$NOTES" --latest
          fi
