# Сборка Android-приложения ЕТИС 3.0 (WebView + встроенный userscript).
# Запускается при изменениях в android/, dist/ или manifest.json на main,
# публикует APK, etis3.user.js и его подпись (.sig) в релиз vX.Y.Z.
# Подпись — только ключами из секретов репозитория; в PR собирается отладочная версия.
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'dist/**'
      - 'manifest.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'tests/fixtures/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Релиз подписывается только ключом из секретов. В PR — отладочная сборка (для проверки, не для установки).
      - name: Ключ подписи из секретов
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ETIS3_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ETIS3_KEYSTORE_PASSWORD }}
          SCRIPT_KEY: ${{ secrets.ETIS3_SCRIPT_SIGNING_KEY }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$SCRIPT_KEY" ]; then
            echo "::error::Нет секретов ETIS3_KEYSTORE_BASE64 / ETIS3_KEYSTORE_PASSWORD / ETIS3_SCRIPT_SIGNING_KEY — релиз не собирается (см. README, раздел «Подпись»)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ETIS3_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Тесты парсеров
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Сборка APK
        working-directory: android
        env:
          ETIS3_KEYSTORE_PASSWORD: ${{ secrets.ETIS3_KEYSTORE_PASSWORD }}
          ETIS3_KEY_ALIAS: ${{ secrets.ETIS3_KEY_ALIAS }}
          ETIS3_KEY_PASSWORD: ${{ secrets.ETIS3_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
            mkdir -p app/build/outputs/apk/release
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      # Подпись userscript-а: приложение принимает обновление скрипта только с верной подписью
      - name: Подпись userscript
        if: github.event_name != 'pull_request'
        env:
          SCRIPT_KEY: ${{ secrets.ETIS3_SCRIPT_SIGNING_KEY }}
        run: |
          mkdir -p out
          # Ключ мог вставиться в секрет в одну строку, с \r или лишними пробелами — собираем PEM заново
          BODY=$(printf '%s' "$SCRIPT_KEY" | tr -d '\r' | sed -e 's/-----BEGIN [A-Z ]*-----//' -e 's/-----END [A-Z ]*-----//' | tr -d ' \n\t')
          KIND=$(printf '%s' "$SCRIPT_KEY" | grep -o 'BEGIN [A-Z ]*PRIVATE KEY' | head -1 | sed 's/BEGIN //')
          [ -n "$KIND" ] || KIND="EC PRIVATE KEY"
          { echo "-----BEGIN $KIND-----"; printf '%s\n' "$BODY" | fold -w 64; echo "-----END $KIND-----"; } > "$RUNNER_TEMP/script.pem"
          openssl pkey -in "$RUNNER_TEMP/script.pem" -noout 2>/dev/null || { echo "::error::ETIS3_SCRIPT_SIGNING_KEY не читается как закрытый ключ (тип: $KIND, длина тела: ${#BODY})"; exit 1; }
          cp dist/etis3.user.js out/etis3.user.js
          openssl dgst -sha256 -sign "$RUNNER_TEMP/script.pem" -out out/etis3.user.js.sig out/etis3.user.js
          openssl dgst -sha256 -verify android/app/src/main/res/raw/script_pub.pem -signature out/etis3.user.js.sig out/etis3.user.js
          sha256sum out/etis3.user.js
          rm -f "$RUNNER_TEMP/script.pem"

      - name: Версия
        id: v
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Файлы
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/etis3.apk
          cp out/etis3.apk "out/etis3-${{ steps.v.outputs.version }}.apk"

      - name: Архив расширения для компьютера
        run: |
          mkdir -p ext/etis-3.0
          cp -r manifest.json settings.js scripts.js styles.css popup.html popup.js background.js icon.svg icons fonts LICENSE ext/etis-3.0/
          (cd ext && zip -qr ../out/etis-3.0.zip etis-3.0)
          unzip -l out/etis-3.0.zip | grep -q 'etis-3.0/manifest.json'

      - name: Проверка APK
        run: |
          APK=out/etis3.apk
          unzip -l "$APK" | grep -q 'assets/etis3.user.js' || { echo "Нет assets/etis3.user.js в APK"; exit 1; }
          unzip -p "$APK" assets/etis3.user.js | grep -m1 '@version'
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -3
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|launchable-activity|sdkVersion|application-label:" || true
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: etis3-apk-${{ steps.v.outputs.version }}${{ github.event_name == 'pull_request' && '-debug' || '' }}
          path: out/*.apk

      - name: Релиз на GitHub
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          NOTES="Android — etis3.apk (скрипт внутри обновляется сам). Компьютер — etis-3.0.zip (расширение для Chrome / Edge / Яндекс / Opera). Инструкции: https://github.com/${{ github.repository }}/tree/main/docs"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk out/etis-3.0.zip out/etis3.user.js out/etis3.user.js.sig --clobber
          else
            gh release create "$TAG" out/*.apk out/etis-3.0.zip out/etis3.user.js out/etis3.user.js.sig --title "ЕТИС 3.0 $TAG" --notes "$NOTES" --latest
          fi
