<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Итоги голосования — экран</title>
<style>
/* Экран для монитора/проектора: одна тёмная тема, всё в единицах экрана (vh/vw) */
:root{
  --bg:#0E1412; --surface:#16201C; --ink:#EEF2EE; --muted:#93A098; --line:#26302B; --grid:#2C3833;
  --accent:#4FBF9F; --accent-ink:#0D1412; --soft:#1E2B26;
  --gold:#E9B949; --silver:#C3C9CF; --bronze:#D29468; --medal-ink:#17191B;
  --up:#4FBF9F; --down:#E5795A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
[hidden]{display:none!important}

.deck{position:fixed;inset:0}
.slide{position:absolute;inset:0;padding:6vh 6vw 9vh;display:flex;flex-direction:column;gap:3.2vh;opacity:0;transform:translateY(1.5vh);transition:opacity .6s,transform .6s;pointer-events:none}
.slide.on{opacity:1;transform:none;pointer-events:auto}
.eyebrow{font-size:1.9vh;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.h1{font-size:8.5vh;font-weight:800;line-height:1.02;margin:0;letter-spacing:-.01em;text-wrap:balance}
.h2{font-size:5vh;font-weight:800;line-height:1.08;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Заставка */
.cover{justify-content:center;gap:4vh}
.stats{display:flex;gap:6vw;margin-top:3vh}
.stat b{display:block;font-size:10vh;line-height:1;font-weight:800;color:var(--ink)}
.stat span{font-size:2.4vh;color:var(--muted)}

/* Турнирная таблица */
.board{display:flex;flex-direction:column;flex:1;min-height:0;justify-content:center}
.brow{display:grid;grid-template-columns:7vh minmax(0,1fr) 34vw 12vh;align-items:center;gap:2.5vw;padding:1.4vh 0;border-top:1px solid var(--line);opacity:0;transform:translateX(-2vw)}
.brow:first-child{border-top:0}
.on .brow{animation:in .6s cubic-bezier(.2,.7,.2,1) forwards}
.place{display:inline-grid;place-items:center;width:6vh;height:6vh;border-radius:50%;background:var(--soft);color:var(--accent);font-weight:800;font-size:2.8vh}
.place.m1{background:var(--gold);color:var(--medal-ink)} .place.m2{background:var(--silver);color:var(--medal-ink)} .place.m3{background:var(--bronze);color:var(--medal-ink)}
.bname{font-size:3.3vh;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.bname small{display:block;font-size:2vh;color:var(--muted);font-weight:400;margin-top:.4vh}
.track{height:2.2vh;background:var(--soft);border-radius:1.1vh;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--accent);border-radius:1.1vh;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.track i.top{background:var(--gold)}
.bval{font-size:4.6vh;font-weight:800;text-align:right}
@keyframes in{to{opacity:1;transform:none}}

/* Профиль презентации */
.prof{display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);gap:4vw;flex:1;min-height:0;align-items:center}
.radar{height:100%;min-height:0;display:flex;align-items:center;justify-content:center}
.radar svg{height:min(66vh,42vw);width:auto;overflow:visible}
.radar svg text{font-size:9px}
.phead{display:flex;align-items:center;gap:2vw}
.phead .place{width:9vh;height:9vh;font-size:4.4vh;flex:none}
.ptotal{display:flex;align-items:baseline;gap:1.2vw;margin-top:1vh}
.ptotal b{font-size:9vh;line-height:1;font-weight:800}
.ptotal span{font-size:2.4vh;color:var(--muted)}
.crit{display:flex;flex-direction:column;gap:2.2vh;margin-top:3vh}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 8vh 12vh;gap:1.5vw;align-items:end}
.crow .cn{font-size:2.5vh;font-weight:600}
.crow .cv{font-size:3.4vh;font-weight:800;text-align:right;line-height:1}
.crow .cd{font-size:2vh;font-weight:700;text-align:right;white-space:nowrap}
.cd.up{color:var(--up)} .cd.down{color:var(--down)} .cd.eq{color:var(--muted)}
.ctrack{grid-column:1/-1;position:relative;height:1.4vh;background:var(--soft);border-radius:.7vh;margin-top:-1vh}
.ctrack i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);border-radius:.7vh;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.ctrack u{position:absolute;top:-.6vh;bottom:-.6vh;width:.35vh;background:var(--ink);opacity:.7;border-radius:.2vh;text-decoration:none}
.legend{display:flex;gap:2.5vw;font-size:1.9vh;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:.8vw}
.legend i.l{width:3vh;border-top:.4vh solid var(--accent)} .legend i.d{width:3vh;border-top:.3vh dashed var(--muted)} .legend i.m{width:.35vh;height:2vh;background:var(--ink);opacity:.7}

/* Лучшие по критериям */
.best{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,26vw),1fr));gap:2.4vh 2vw;flex:1;align-content:center}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:2vh;padding:3vh 2vw;display:flex;flex-direction:column;gap:1.2vh;opacity:0;transform:translateY(2vh)}
.on .bcard{animation:in .6s cubic-bezier(.2,.7,.2,1) forwards}
.bcard .k{font-size:2vh;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.bcard .w{font-size:3.2vh;font-weight:700;line-height:1.15}
.bcard .s{font-size:6vh;font-weight:800;line-height:1}

/* Навигация */
.nav{position:fixed;left:0;right:0;bottom:0;height:7vh;display:flex;align-items:center;justify-content:space-between;padding:0 6vw;color:var(--muted);font-size:1.8vh;z-index:5}
.dots{display:flex;gap:.8vw}
.dots button{appearance:none;border:0;width:1.2vh;height:1.2vh;border-radius:50%;background:var(--grid);padding:0;cursor:pointer}
.dots button.on{background:var(--accent);width:3.4vh;border-radius:.6vh}
.ctrl{display:flex;gap:.8vw}
.ctrl button{appearance:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:1vh;font:inherit;font-size:1.8vh;padding:.9vh 1.4vw;cursor:pointer}
.ctrl button:hover{border-color:var(--accent)}
.bar{position:fixed;left:0;top:0;height:.5vh;background:var(--accent);width:0;z-index:6}
.msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center;padding:4vw}
.msg h1{font-size:5vh;margin:0}
.msg p{font-size:2.4vh;color:var(--muted);margin:0;max-width:60ch}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.slide,.track i,.ctrack i{transition:none}.on .brow,.on .bcard{animation:none;opacity:1;transform:none}}
</style>
<script src="/charts.js"></script>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="deck" id="deck"></div>
<div class="msg" id="msg" hidden></div>
<div class="nav" id="nav" hidden>
  <div class="dots" id="dots"></div>
  <span id="hint">← → листать · пробел — пауза · F — на весь экран</span>
  <div class="ctrl"><button id="b-play">Пауза</button><button id="b-full">На весь экран</button></div>
</div>
<script>
(() => {
const $ = id => document.getElementById(id);
const VC = window.VoteCharts;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = x => x == null ? '—' : x.toFixed(2).replace('.', ',');
const pl = (n, a, b, c) => VC.plural(n, a, b, c);
const medal = p => p <= 3 ? ' m' + p : '';
const DUR = 12000;

let key = new URLSearchParams(location.search).get('key') || '';
try { if (!key) key = localStorage.getItem('pv_admin_key') || ''; } catch(e){}

let cfg = null, res = null, sig = '', idx = 0, slides = [], playing = true, timer = null, started = 0;

async function load(){
  try {
    if (key){
      const r = await fetch('/api/admin?key=' + encodeURIComponent(key), {cache:'no-store'});
      if (r.ok){ const d = await r.json(); cfg = d.config; res = d.results; return true; }
    }
    const d = await (await fetch('/api/config', {cache:'no-store'})).json();
    cfg = d; res = d.results || null;
    return true;
  } catch(e){ return false; }
}

function message(title, text){
  $('deck').innerHTML = ''; $('nav').hidden = true;
  $('msg').hidden = false; $('msg').innerHTML = `<h1>${esc(title)}</h1><p>${esc(text)}</p>`;
}

function build(){
  if (!res){ message('Итоги пока скрыты', 'Они появятся здесь, когда организатор закроет приём оценок. Страница обновится сама.'); return; }
  const rows = VC.ranked(res), S = cfg.scale, C = res.criteria;
  if (!rows.length){ message('Оценок пока нет', 'Экран обновится сам, как только появятся первые оценки.'); return; }
  $('msg').hidden = true; $('nav').hidden = false;
  const avg = C.map((_, k) => { const v = rows.map(r => r.avgs[k]).filter(a => a != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; });
  const out = [];

  out.push(`<section class="slide cover">
    <span class="eyebrow">Итоги голосования</span>
    <h1 class="h1">${esc(cfg.title)}</h1>
    <div class="stats">
      <div class="stat"><b class="num">${rows.length}</b><span>${pl(rows.length, 'презентация', 'презентации', 'презентаций')}</span></div>
      <div class="stat"><b class="num">${res.voters}</b><span>${pl(res.voters, 'человек оценивал', 'человека оценивали', 'человек оценивали')}</span></div>
      <div class="stat"><b class="num">${res.total_votes}</b><span>${pl(res.total_votes, 'оценка', 'оценки', 'оценок')} по ${C.length} ${pl(C.length, 'критерию', 'критериям', 'критериям')}</span></div>
    </div></section>`);

  const top = rows.slice(0, 10);
  out.push(`<section class="slide">
    <span class="eyebrow">Турнирная таблица</span>
    <h2 class="h2">Средний балл по всем критериям</h2>
    <div class="board">${top.map((r, i) => `<div class="brow" style="animation-delay:${(top.length - 1 - i) * 140}ms">
      <span class="place${medal(r.place)}">${r.place}</span>
      <span class="bname">${esc(r.name)}<small>${r.votes} ${pl(r.votes, 'голос', 'голоса', 'голосов')}</small></span>
      <span class="track"><i class="${r.place === 1 ? 'top' : ''}" data-w="${r.total / S * 100}"></i></span>
      <span class="bval num">${fmt(r.total)}</span></div>`).join('')}</div>
    ${rows.length > top.length ? `<p class="muted" style="font-size:2vh;margin:0">…и ещё ${rows.length - top.length}</p>` : ''}
  </section>`);

  rows.forEach(r => {
    out.push(`<section class="slide">
      <div class="prof">
        <div class="radar">${C.length >= 3 ? VC.radarSvg(r, avg, C, S) : ''}</div>
        <div>
          <div class="phead"><span class="place${medal(r.place)}">${r.place}</span><div><span class="eyebrow">${r.place} место</span><h2 class="h2">${esc(r.name)}</h2></div></div>
          <div class="ptotal"><b class="num">${fmt(r.total)}</b><span>средний балл · ${r.votes} ${pl(r.votes, 'голос', 'голоса', 'голосов')}</span></div>
          <div class="crit">${C.map((n, k) => {
            const v = r.avgs[k], a = avg[k], d = v != null && a != null ? v - a : null;
            const cls = d == null || Math.abs(d) < 0.05 ? 'eq' : d > 0 ? 'up' : 'down';
            const txt = d == null ? '' : cls === 'eq' ? 'как в среднем' : (d > 0 ? '▲ +' : '▼ −') + Math.abs(d).toFixed(2).replace('.', ',');
            return `<div class="crow"><span class="cn">${esc(n)}</span><span class="cv num">${fmt(v)}</span><span class="cd ${cls} num">${txt}</span>
              <span class="ctrack"><i data-w="${(v || 0) / S * 100}"></i>${a != null ? `<u style="left:${a / S * 100}%"></u>` : ''}</span></div>`;
          }).join('')}</div>
          <div class="legend" style="margin-top:3vh"><span><i class="l"></i>эта презентация</span><span><i class="d"></i><i class="m"></i>среднее по всем презентациям</span></div>
        </div>
      </div></section>`);
  });

  const best = C.map((n, k) => { let b = null; rows.forEach(r => { if (r.avgs[k] != null && (!b || r.avgs[k] > b.avgs[k])) b = r; }); return b ? {n, r: b, v: b.avgs[k]} : null; }).filter(Boolean);
  out.push(`<section class="slide">
    <span class="eyebrow">Лучшие по критериям</span>
    <h2 class="h2">Кто сильнее всех в каждом критерии</h2>
    <div class="best">${best.map((b, i) => `<div class="bcard" style="animation-delay:${i * 120}ms"><span class="k">${esc(b.n)}</span><span class="w">${esc(b.r.name)}</span><span class="s num">${fmt(b.v)}</span></div>`).join('')}</div>
  </section>`);

  $('deck').innerHTML = out.join('');
  slides = [...document.querySelectorAll('.slide')];
  $('dots').innerHTML = slides.map((_, i) => `<button aria-label="Слайд ${i + 1}"></button>`).join('');
  [...$('dots').children].forEach((b, i) => b.addEventListener('click', () => go(i)));
  if (idx >= slides.length) idx = 0;
  show(idx);
}

function show(i){
  slides.forEach((s, k) => {
    s.classList.toggle('on', k === i);
    if (k !== i) s.querySelectorAll('[data-w]').forEach(el => el.style.width = '0');
  });
  [...$('dots').children].forEach((b, k) => b.classList.toggle('on', k === i));
  const s = slides[i];
  setTimeout(() => s.querySelectorAll('[data-w]').forEach((el, k) => {
    setTimeout(() => el.style.width = el.dataset.w + '%', el.closest('.brow') ? 400 + (slides[i].querySelectorAll('.brow').length - 1 - [...slides[i].querySelectorAll('.brow')].indexOf(el.closest('.brow'))) * 140 : 200 + k * 80);
  }), 50);
  idx = i; restartTimer();
}
function go(i){ if (!slides.length) return; show((i + slides.length) % slides.length); }
function restartTimer(){
  clearTimeout(timer); started = performance.now();
  if (playing) timer = setTimeout(() => go(idx + 1), DUR);
}
(function tick(){
  const p = playing && slides.length ? Math.min(1, (performance.now() - started) / DUR) : 0;
  $('bar').style.width = (p * 100) + '%';
  requestAnimationFrame(tick);
})();

function togglePlay(){ playing = !playing; $('b-play').textContent = playing ? 'Пауза' : 'Автопоказ'; restartTimer(); }
function fullscreen(){ const d = document.documentElement; if (document.fullscreenElement) document.exitFullscreen?.(); else d.requestFullscreen?.().catch(() => {}); }
$('b-play').addEventListener('click', togglePlay);
$('b-full').addEventListener('click', fullscreen);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown'){ e.preventDefault(); go(idx + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); go(idx - 1); }
  else if (e.key === ' '){ e.preventDefault(); togglePlay(); }
  else if (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') fullscreen();
  else if (e.key === 'Home') go(0);
});
// Скрываем курсор и панель, когда мышь не двигается
let idle;
document.addEventListener('mousemove', () => { document.body.style.cursor = ''; $('nav').style.opacity = 1; clearTimeout(idle); idle = setTimeout(() => { document.body.style.cursor = 'none'; $('nav').style.opacity = .35; }, 3000); });

async function refresh(){
  if (!(await load())) return;
  const s = JSON.stringify([cfg && cfg.title, cfg && cfg.scale, res && res.rows, res && res.criteria]);
  if (s !== sig){ sig = s; build(); }
}
refresh(); setInterval(refresh, 10000);
})();
</script>
</body>
</html>
