<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Голосование — управление</title>
<style>
:root{
  --bg:#F3F4EF; --surface:#FFFFFF; --ink:#17191B; --muted:#5D6460; --line:#D9DCD3;
  --accent:#1D6B57; --accent-ink:#FFFFFF; --soft:#E7EEE9; --mark:#FFD84D; --mark-ink:#17191B; --bad:#B3261E;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121514; --surface:#1A1E1C; --ink:#ECEFEA; --muted:#9BA39E; --line:#2D3330;
  --accent:#4FBF9F; --accent-ink:#0D1412; --soft:#203029; --mark:#F2CC45; --mark-ink:#17191B; --bad:#FF8A80;
  color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px 16px 60px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:26px;line-height:1.15;margin:0}
h2{font-size:18px;margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.qr{background:#fff;border-radius:10px;padding:10px;display:flex;justify-content:center}
.qr img{width:100%;max-width:300px;image-rendering:pixelated}
.url{font:13px ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere;background:var(--bg);padding:8px 10px;border-radius:8px;border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px system-ui,sans-serif;padding:8px 14px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;font:14px system-ui,sans-serif;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;text-align:left}
.chip[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:var(--mark-ink);font-weight:600}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.status.on .dot{background:#2EA36B}
.status.off .dot{background:var(--bad)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;font-weight:600;color:var(--muted);white-space:normal;vertical-align:bottom;min-width:70px}
th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal;min-width:170px}
th:first-child,td:first-child{text-align:center;width:48px;min-width:48px}
tr:last-child td{border-bottom:0}
.place{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--accent);font-weight:700}
tr.top1 .place{background:var(--mark);color:var(--mark-ink)}
td.total{font-weight:700;font-size:16px}
.meter{display:block;height:4px;background:var(--soft);border-radius:2px;margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600}
.cm{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;overflow-wrap:anywhere}
.cm:last-child{border-bottom:0}
label{font-weight:600;font-size:14px}
input[type=text],input[type=password],textarea,select{width:100%;font:15px/1.45 system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{resize:vertical}
.field{display:flex;flex-direction:column;gap:6px}
.stage{position:fixed;inset:0;background:#fff;color:#17191B;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:16px}
.stage h2{font-size:clamp(24px,5vh,60px);text-align:center;line-height:1.1}
.stage .now{font-size:clamp(18px,3vh,32px);color:#1D6B57;text-align:center;font-weight:600}
.stage img{height:min(64vh,90vw);max-width:100%;image-rendering:pixelated}
.stage .u{font:clamp(14px,2.4vh,24px) ui-monospace,Menlo,monospace;color:#5D6460}
.stage .close{position:absolute;top:12px;right:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:60}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Загрузка…</p></div>
<div class="stage" id="stage" hidden>
  <button class="btn close" id="stage-close">Закрыть</button>
  <h2 id="stage-title"></h2>
  <div class="now" id="stage-now"></div>
  <img id="stage-qr" alt="QR-код голосования">
  <div class="u" id="stage-url"></div>
</div>
<script src="/qrcode.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const app = $('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const voteUrl = location.origin + '/';
let key = new URLSearchParams(location.search).get('key') || '';
try { if (key) localStorage.setItem('pv_admin_key', key); else key = localStorage.getItem('pv_admin_key') || ''; } catch(e){}
let data = null, editing = false, timer = null;

function toast(m){ const t = document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }
function qrSrc(text, px){
  const q = qrcode(0,'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), quiet = 3, cell = Math.max(4, Math.floor(px/(n+quiet*2))), size = cell*(n+quiet*2);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,size,size); x.fillStyle='#111';
  for (let r=0;r<n;r++) for (let k=0;k<n;k++) if (q.isDark(r,k)) x.fillRect((k+quiet)*cell,(r+quiet)*cell,cell,cell);
  return c.toDataURL('image/png');
}
async function api(path, body){
  const r = await fetch(path + (path.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(key), body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {cache:'no-store'});
  if (r.status === 403) throw new Error('bad_key');
  const d = await r.json(); if (!r.ok) throw new Error(d.error || 'error'); return d;
}

function gate(msg){
  clearInterval(timer);
  app.innerHTML = `<h1>Управление голосованием</h1>
    <form class="box" id="gate" style="max-width:420px">
      <div class="field"><label for="k">Ключ администратора</label><input type="password" id="k" autocomplete="current-password"></div>
      ${msg ? `<p class="small" style="color:var(--bad)">${esc(msg)}</p>` : '<p class="small muted">Ключ выдал установщик. Его можно найти на сервере: <code>cat /etc/presentation-vote.env</code></p>'}
      <button class="btn primary" type="submit">Войти</button>
    </form>`;
  $('gate').addEventListener('submit', e => { e.preventDefault(); key = $('k').value.trim(); try { localStorage.setItem('pv_admin_key', key); } catch(_){} start(); });
}

async function refresh(){
  try { data = await api('/api/admin'); }
  catch(e){ if (e.message === 'bad_key') return gate(key ? 'Неверный ключ.' : ''); toast('Нет связи с сервером'); return; }
  render();
}

function render(){
  const {config:c, results:r} = data;
  if (!$('main')){
    app.innerHTML = `
      <div class="row" style="justify-content:space-between"><h1 id="h-title"></h1><span id="st"></span></div>
      <div class="grid" id="main">
        <div class="box">
          <h2>QR для зала</h2>
          <div class="qr"><img id="qr" alt="QR-код голосования"></div>
          <div class="url" id="url"></div>
          <div class="row"><button class="btn primary" id="full">На весь экран</button><button class="btn" id="copy">Копировать ссылку</button></div>
          <p class="small muted">QR — картинка: удерживайте палец или правая кнопка → «Сохранить изображение».</p>
        </div>
        <div style="display:flex;flex-direction:column;gap:18px;min-width:0">
          <div class="box">
            <div class="row" style="justify-content:space-between"><h2>Сейчас выступает</h2><button class="btn" id="toggle"></button></div>
            <p class="small muted">Тем, кто отсканирует QR, сразу откроется оценка этой презентации.</p>
            <div class="chips" id="cur"></div>
          </div>
          <div class="box">
            <div class="row" style="justify-content:space-between"><h2>Рейтинг</h2><span class="small muted" id="stats"></span></div>
            <div class="tablebox"><table id="tbl"></table></div>
            <div id="comments"></div>
            <div class="row"><a class="btn" id="csv">Скачать все ответы (CSV для Excel)</a></div>
          </div>
        </div>
      </div>
      <form class="box" id="settings">
        <h2>Настройки</h2>
        <div class="field"><label for="s-title">Заголовок</label><input type="text" id="s-title" maxlength="120"></div>
        <div class="field"><label for="s-pres">Презентации, по одной в строке</label><textarea id="s-pres" rows="6"></textarea>
          <span class="small muted">Если переименовать презентацию, у которой уже есть оценки, старые оценки останутся под старым названием.</span></div>
        <div class="field"><label for="s-crit">Критерии, по одному в строке: «Название — пояснение»</label><textarea id="s-crit" rows="5"></textarea></div>
        <div class="row">
          <label for="s-scale">Шкала</label>
          <select id="s-scale" style="width:auto"><option value="5">1–5</option><option value="10">1–10</option></select>
          <label class="row" style="font-weight:500"><input type="checkbox" id="s-comments"> Поле для комментария</label>
        </div>
        <div class="row"><button class="btn primary" type="submit">Сохранить</button><span class="small muted" id="s-msg"></span></div>
      </form>
      <div class="box">
        <h2>Сбросить все оценки</h2>
        <p class="small muted">Удалит все ответы. Отменить нельзя — сначала скачайте CSV. Для подтверждения впишите RESET.</p>
        <div class="row"><input type="text" id="rs" style="max-width:160px" autocomplete="off"><button class="btn danger" id="reset">Удалить все оценки</button></div>
      </div>`;
    $('url').textContent = voteUrl;
    $('qr').src = qrSrc(voteUrl, 600);
    $('csv').href = '/api/export.csv?key=' + encodeURIComponent(key);
    $('copy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(voteUrl); toast('Ссылка скопирована'); } catch(e){ toast(voteUrl); } });
    $('full').addEventListener('click', showStage);
    $('stage-close').addEventListener('click', closeStage);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeStage(); });
    $('toggle').addEventListener('click', async () => { await save({open: !data.config.open}); });
    $('settings').addEventListener('input', () => editing = true);
    $('settings').addEventListener('submit', async e => {
      e.preventDefault();
      const crit = $('s-crit').value.split('\n').map(s => s.trim()).filter(Boolean).map(s => { const m = s.split(/\s+[—–-]\s+/); return {name:m[0], desc:m.slice(1).join(' — ')}; });
      await save({title:$('s-title').value, presentations:$('s-pres').value.split('\n'), criteria:crit, scale:+$('s-scale').value, comments:$('s-comments').checked});
      editing = false; fillSettings(); $('s-msg').textContent = 'Сохранено';
      setTimeout(() => $('s-msg') && ($('s-msg').textContent = ''), 2000);
    });
    $('reset').addEventListener('click', async () => {
      if ($('rs').value.trim() !== 'RESET'){ toast('Впишите RESET в поле'); return; }
      try { await api('/api/admin/reset', {confirm:'RESET'}); $('rs').value=''; toast('Все оценки удалены'); refresh(); } catch(e){ toast('Не получилось'); }
    });
    fillSettings();
  }
  $('h-title').textContent = c.title;
  $('st').className = 'status ' + (c.open ? 'on' : 'off');
  $('st').innerHTML = `<span class="dot"></span>${c.open ? 'Приём оценок открыт' : 'Приём оценок закрыт'}`;
  $('toggle').textContent = c.open ? 'Закрыть приём' : 'Открыть приём';
  $('cur').innerHTML = [['', 'Никто (показывать список)'], ...c.presentations.map(p => [p, p])]
    .map(([v, t]) => `<button class="chip" data-v="${esc(v)}" aria-pressed="${c.current === v}">${esc(t)}</button>`).join('');
  $('cur').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => save({current: b.dataset.v})));
  if (!editing) fillSettings();

  $('stats').textContent = `${r.total_votes} оценок от ${r.voters} человек · обновляется само`;
  const f = x => x == null ? '—' : x.toFixed(2).replace('.', ',');
  let place = 0, prev = null;
  $('tbl').innerHTML = `<thead><tr><th>Место</th><th>Презентация</th><th>Голосов</th>${r.criteria.map(n => `<th>${esc(n)}</th>`).join('')}<th>Средний балл</th></tr></thead>
    <tbody>${r.rows.map((row, i) => {
      if (row.total != null && f(row.total) !== prev){ place = i + 1; prev = f(row.total); }
      const pl = row.total == null ? '—' : place;
      return `<tr class="${pl === 1 ? 'top1' : ''}"><td><span class="place">${pl}</span></td><td>${esc(row.name)}${row.removed ? ' <span class="small muted">(удалена из списка)</span>' : ''}</td><td>${row.votes}</td>${row.avgs.map(a => `<td>${f(a)}</td>`).join('')}<td class="total">${f(row.total)}<span class="meter"><i style="width:${row.total ? row.total / c.scale * 100 : 0}%"></i></span></td></tr>`;
    }).join('')}</tbody>`;
  const withC = r.rows.filter(x => x.comments.length);
  const openNow = [...document.querySelectorAll('#comments details[open]')].map(d => d.dataset.n);
  $('comments').innerHTML = withC.map(x => `<details data-n="${esc(x.name)}" ${openNow.includes(x.name) ? 'open' : ''}><summary>Комментарии: ${esc(x.name)} (${x.comments.length})</summary>${x.comments.map(cm => `<div class="cm">${esc(cm.text)}</div>`).join('')}</details>`).join('');
  if (!$('stage').hidden) $('stage-now').textContent = c.current ? 'Сейчас: ' + c.current : '';
}

function fillSettings(){
  const c = data.config;
  $('s-title').value = c.title;
  $('s-pres').value = c.presentations.join('\n');
  $('s-crit').value = c.criteria.map(x => x.desc ? `${x.name} — ${x.desc}` : x.name).join('\n');
  $('s-scale').value = String(c.scale);
  $('s-comments').checked = c.comments;
}
async function save(patch){
  try { const d = await api('/api/admin/config', patch); data.config = d.config; render(); }
  catch(e){ toast(e.message === 'bad_key' ? 'Неверный ключ' : 'Не удалось сохранить'); }
}
function showStage(){
  $('stage-title').textContent = data.config.title;
  $('stage-now').textContent = data.config.current ? 'Сейчас: ' + data.config.current : '';
  $('stage-qr').src = qrSrc(voteUrl, 1200);
  $('stage-url').textContent = voteUrl.replace(/^https?:\/\//, '').replace(/\/$/, '');
  $('stage').hidden = false;
  document.documentElement.requestFullscreen?.().catch(() => {});
}
function closeStage(){ $('stage').hidden = true; if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {}); }

function start(){ app.innerHTML = '<p class="muted">Загрузка…</p>'; refresh(); clearInterval(timer); timer = setInterval(refresh, 4000); }
if (key) start(); else gate('');
})();
</script>
</body>
</html>
