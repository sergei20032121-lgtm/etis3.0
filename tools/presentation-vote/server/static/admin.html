<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Голосование — управление</title>
<style>
:root{
  --bg:#F3F4EF; --surface:#FFFFFF; --ink:#17191B; --muted:#5D6460; --line:#D9DCD3;
  --accent:#1D6B57; --accent-ink:#FFFFFF; --soft:#E7EEE9; --mark:#FFD84D; --mark-ink:#17191B; --bad:#B3261E;
  --d1:#B5452A; --d2:#E8A68D; --d3:#CBCEC7; --d4:#86C4AE; --d5:#1D6B57; --grid:#E6E8E1;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121514; --surface:#1A1E1C; --ink:#ECEFEA; --muted:#9BA39E; --line:#2D3330;
  --accent:#4FBF9F; --accent-ink:#0D1412; --soft:#203029; --mark:#F2CC45; --mark-ink:#17191B; --bad:#FF8A80;
  --d1:#E5795A; --d2:#8E4C3A; --d3:#4B514D; --d4:#2E7C66; --d5:#6AD1B0; --grid:#262B28;
  color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px 16px 60px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:26px;line-height:1.15;margin:0}
h2{font-size:18px;margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.qr{background:#fff;border-radius:10px;padding:10px;display:flex;justify-content:center}
.qr img{width:100%;max-width:300px;image-rendering:pixelated}
.url{font:13px ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere;background:var(--bg);padding:8px 10px;border-radius:8px;border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px system-ui,sans-serif;padding:8px 14px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;font:14px system-ui,sans-serif;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;text-align:left}
.chip[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:var(--mark-ink);font-weight:600}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.status.on .dot{background:#2EA36B}
.status.off .dot{background:var(--bad)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;font-weight:600;color:var(--muted);white-space:normal;vertical-align:bottom;min-width:70px}
th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal;min-width:170px}
th:first-child,td:first-child{text-align:center;width:48px;min-width:48px}
tr:last-child td{border-bottom:0}
.place{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--accent);font-weight:700}
tr.top1 .place{background:var(--mark);color:var(--mark-ink)}
td.total{font-weight:700;font-size:16px}
.meter{display:block;height:4px;background:var(--soft);border-radius:2px;margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600}
.cm{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;overflow-wrap:anywhere}
.cm:last-child{border-bottom:0}
label{font-weight:600;font-size:14px}
input[type=text],input[type=password],textarea,select{width:100%;font:15px/1.45 system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{resize:vertical}
.field{display:flex;flex-direction:column;gap:6px}
.stage{position:fixed;inset:0;background:#fff;color:#17191B;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:16px}
.stage h2{font-size:clamp(24px,5vh,60px);text-align:center;line-height:1.1}
.stage .now{font-size:clamp(18px,3vh,32px);color:#1D6B57;text-align:center;font-weight:600}
.stage img{height:min(64vh,90vw);max-width:100%;image-rendering:pixelated}
.stage .u{font:clamp(14px,2.4vh,24px) ui-monospace,Menlo,monospace;color:#5D6460}
.stage .close{position:absolute;top:12px;right:12px}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:900px){.charts{grid-template-columns:minmax(0,1fr)}}
.chart{display:flex;flex-direction:column;gap:10px;min-width:0}
.chart h3{font-size:15px;margin:0}
.chart .sub{font-size:13px;color:var(--muted);margin-top:-6px}
.hbars{display:grid;grid-template-columns:minmax(90px,38%) minmax(0,1fr) 44px;column-gap:10px;row-gap:8px;align-items:center}
.hbars .nm{font-size:14px;overflow-wrap:anywhere;line-height:1.25}
.hbars .tr{position:relative;height:16px}
.hbars .tr::before{content:"";position:absolute;inset:-4px 0;background:linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/calc(100% / var(--ticks)) 100%;border-right:1px solid var(--grid)}
.hbars .ax span{position:absolute;transform:translateX(-50%)}
.hbars .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:0 4px 4px 0;transition:width .5s}
.hbars .vl{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;font-size:14px}
.hbars .ax{grid-column:2;position:relative;height:14px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.heat{overflow-x:auto}
.heat table{border-collapse:separate;border-spacing:2px;width:100%}
.heat th{font-size:11px;color:var(--muted);font-weight:600;text-align:center;padding:2px 4px;border:0;white-space:normal;min-width:0;vertical-align:bottom}
.heat th:first-child{text-align:left}
.heat td{border:0;padding:8px 6px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;border-radius:4px;min-width:44px;white-space:nowrap}
.heat td:first-child{text-align:left;font-size:13px;white-space:normal;min-width:110px;padding-left:0;overflow-wrap:anywhere}
.heat td.best{box-shadow:inset 0 0 0 2px var(--mark)}
.ramp{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.ramp span.g{flex:0 0 120px;height:10px;border-radius:3px;background:linear-gradient(90deg,color-mix(in oklab,var(--accent) 8%,var(--surface)),var(--accent))}
.dist{display:grid;grid-template-columns:minmax(90px,38%) minmax(0,1fr);column-gap:10px;row-gap:8px;align-items:center}
.dist .nm{font-size:14px;overflow-wrap:anywhere;line-height:1.25}
.dist .st{display:flex;gap:2px;height:16px}
.dist .st i{display:block;height:100%;min-width:2px}
.dist .st i:first-child{border-radius:4px 0 0 4px}.dist .st i:last-child{border-radius:0 4px 4px 0}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{width:12px;height:12px;border-radius:3px;display:inline-block}
.cols{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--line);background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/100% 25%}
.cols i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:0}
.cols i.z{background:transparent}
.cols-ax{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
[data-tip]{cursor:default}
.tip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:6px 9px;border-radius:6px;max-width:260px;line-height:1.35}
.empty{color:var(--muted);font-size:14px;padding:12px 0}
.podium{position:fixed;inset:0;z-index:55;background:#fff;color:#17191B;display:flex;flex-direction:column;gap:3vh;padding:5vh 6vw}
.podium h2{font-size:clamp(26px,5vh,56px);line-height:1.1}
.podium .pl{display:flex;flex-direction:column;gap:2vh;flex:1;justify-content:center}
.podium .pr{display:grid;grid-template-columns:clamp(40px,7vh,80px) minmax(0,30%) minmax(0,1fr) auto;gap:2vw;align-items:center;font-size:clamp(16px,3vh,34px)}
.podium .pr.hid{visibility:hidden}
.podium .pn{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;background:#E7EEE9;color:#1D6B57;font-weight:800}
.podium .pr.first .pn{background:#FFD84D;color:#17191B}
.podium .nm{font-weight:600;overflow-wrap:anywhere;line-height:1.15}
.podium .tr{height:clamp(14px,3vh,34px);background:#EEF0EA;border-radius:0 6px 6px 0;overflow:hidden}
.podium .tr i{display:block;height:100%;background:#1D6B57;border-radius:0 6px 6px 0;width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.podium .vl{font-weight:800;font-variant-numeric:tabular-nums}
.podium .bt{display:flex;gap:10px;justify-content:center}
.podium .btn{background:#fff;color:#17191B;border-color:#C9CDC4;font-size:16px;padding:10px 18px}
.podium .btn.primary{background:#1D6B57;border-color:#1D6B57;color:#fff}
@media (prefers-reduced-motion:reduce){.podium .tr i,.hbars .tr i{transition:none}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:60}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Загрузка…</p></div>
<div class="tip" id="tip" hidden></div>
<div class="podium" id="podium" hidden>
  <h2 id="pd-title">Итоги голосования</h2>
  <div class="pl" id="pd-list"></div>
  <div class="bt"><button class="btn" id="pd-close">Закрыть</button><button class="btn" id="pd-all">Показать все</button><button class="btn primary" id="pd-next">Следующее место</button></div>
</div>
<div class="stage" id="stage" hidden>
  <button class="btn close" id="stage-close">Закрыть</button>
  <h2 id="stage-title"></h2>
  <div class="now" id="stage-now"></div>
  <img id="stage-qr" alt="QR-код голосования">
  <div class="u" id="stage-url"></div>
</div>
<script src="/qrcode.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const app = $('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const voteUrl = location.origin + '/';
let key = new URLSearchParams(location.search).get('key') || '';
try { if (key) localStorage.setItem('pv_admin_key', key); else key = localStorage.getItem('pv_admin_key') || ''; } catch(e){}
let data = null, editing = false, timer = null;

function toast(m){ const t = document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }
function qrSrc(text, px){
  const q = qrcode(0,'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), quiet = 3, cell = Math.max(4, Math.floor(px/(n+quiet*2))), size = cell*(n+quiet*2);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,size,size); x.fillStyle='#111';
  for (let r=0;r<n;r++) for (let k=0;k<n;k++) if (q.isDark(r,k)) x.fillRect((k+quiet)*cell,(r+quiet)*cell,cell,cell);
  return c.toDataURL('image/png');
}
async function api(path, body){
  const r = await fetch(path + (path.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(key), body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {cache:'no-store'});
  if (r.status === 403) throw new Error('bad_key');
  const d = await r.json(); if (!r.ok) throw new Error(d.error || 'error'); return d;
}

function gate(msg){
  clearInterval(timer);
  app.innerHTML = `<h1>Управление голосованием</h1>
    <form class="box" id="gate" style="max-width:420px">
      <div class="field"><label for="k">Ключ администратора</label><input type="password" id="k" autocomplete="current-password"></div>
      ${msg ? `<p class="small" style="color:var(--bad)">${esc(msg)}</p>` : '<p class="small muted">Ключ выдал установщик. Его можно найти на сервере: <code>cat /etc/presentation-vote.env</code></p>'}
      <button class="btn primary" type="submit">Войти</button>
    </form>`;
  $('gate').addEventListener('submit', e => { e.preventDefault(); key = $('k').value.trim(); try { localStorage.setItem('pv_admin_key', key); } catch(_){} start(); });
}

async function refresh(){
  try { data = await api('/api/admin'); }
  catch(e){ if (e.message === 'bad_key') return gate(key ? 'Неверный ключ.' : ''); toast('Нет связи с сервером'); return; }
  render();
}

function render(){
  const {config:c, results:r} = data;
  if (!$('main')){
    app.innerHTML = `
      <div class="row" style="justify-content:space-between"><h1 id="h-title"></h1><span id="st"></span></div>
      <div class="grid" id="main">
        <div class="box">
          <h2>QR для зала</h2>
          <div class="qr"><img id="qr" alt="QR-код голосования"></div>
          <div class="url" id="url"></div>
          <div class="row"><button class="btn primary" id="full">На весь экран</button><button class="btn" id="copy">Копировать ссылку</button></div>
          <p class="small muted">QR — картинка: удерживайте палец или правая кнопка → «Сохранить изображение».</p>
        </div>
        <div style="display:flex;flex-direction:column;gap:18px;min-width:0">
          <div class="box">
            <div class="row" style="justify-content:space-between"><h2>Сейчас выступает</h2><button class="btn" id="toggle"></button></div>
            <p class="small muted">Тем, кто отсканирует QR, сразу откроется оценка этой презентации.</p>
            <div class="chips" id="cur"></div>
          </div>
          <div class="box">
            <div class="row" style="justify-content:space-between"><h2>Рейтинг</h2><span class="small muted" id="stats"></span></div>
            <div class="tablebox"><table id="tbl"></table></div>
            <div id="comments"></div>
            <div class="row"><a class="btn" id="csv">Скачать все ответы (CSV для Excel)</a><button class="btn primary" id="podium-btn">Итоги на экран</button></div>
          </div>
        </div>
      </div>
      <div class="box">
        <h2>Графики</h2>
        <div class="charts" id="charts"></div>
      </div>
      <form class="box" id="settings">
        <h2>Настройки</h2>
        <div class="field"><label for="s-title">Заголовок</label><input type="text" id="s-title" maxlength="120"></div>
        <div class="field"><label for="s-pres">Презентации, по одной в строке</label><textarea id="s-pres" rows="6"></textarea>
          <span class="small muted">Если переименовать презентацию, у которой уже есть оценки, старые оценки останутся под старым названием.</span></div>
        <div class="field"><label for="s-crit">Критерии, по одному в строке: «Название — пояснение»</label><textarea id="s-crit" rows="5"></textarea></div>
        <div class="row">
          <label for="s-scale">Шкала</label>
          <select id="s-scale" style="width:auto"><option value="5">1–5</option><option value="10">1–10</option></select>
          <label class="row" style="font-weight:500"><input type="checkbox" id="s-comments"> Поле для комментария</label>
        </div>
        <div class="row"><button class="btn primary" type="submit">Сохранить</button><span class="small muted" id="s-msg"></span></div>
      </form>
      <div class="box">
        <h2>Сбросить все оценки</h2>
        <p class="small muted">Удалит все ответы. Отменить нельзя — сначала скачайте CSV. Для подтверждения впишите RESET.</p>
        <div class="row"><input type="text" id="rs" style="max-width:160px" autocomplete="off"><button class="btn danger" id="reset">Удалить все оценки</button></div>
      </div>`;
    $('url').textContent = voteUrl;
    $('qr').src = qrSrc(voteUrl, 600);
    $('csv').href = '/api/export.csv?key=' + encodeURIComponent(key);
    $('copy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(voteUrl); toast('Ссылка скопирована'); } catch(e){ toast(voteUrl); } });
    $('full').addEventListener('click', showStage);
    $('podium-btn').addEventListener('click', openPodium);
    $('pd-next').addEventListener('click', revealNext);
    $('pd-all').addEventListener('click', () => { while (revealNext()); });
    $('pd-close').addEventListener('click', closePodium);
    $('stage-close').addEventListener('click', closeStage);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape'){ closeStage(); closePodium(); }
      if (!$('podium').hidden && (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Enter')){ e.preventDefault(); revealNext(); }
    });
    $('toggle').addEventListener('click', async () => { await save({open: !data.config.open}); });
    $('settings').addEventListener('input', () => editing = true);
    $('settings').addEventListener('submit', async e => {
      e.preventDefault();
      const crit = $('s-crit').value.split('\n').map(s => s.trim()).filter(Boolean).map(s => { const m = s.split(/\s+[—–-]\s+/); return {name:m[0], desc:m.slice(1).join(' — ')}; });
      await save({title:$('s-title').value, presentations:$('s-pres').value.split('\n'), criteria:crit, scale:+$('s-scale').value, comments:$('s-comments').checked});
      editing = false; fillSettings(); $('s-msg').textContent = 'Сохранено';
      setTimeout(() => $('s-msg') && ($('s-msg').textContent = ''), 2000);
    });
    $('reset').addEventListener('click', async () => {
      if ($('rs').value.trim() !== 'RESET'){ toast('Впишите RESET в поле'); return; }
      try { await api('/api/admin/reset', {confirm:'RESET'}); $('rs').value=''; toast('Все оценки удалены'); refresh(); } catch(e){ toast('Не получилось'); }
    });
    fillSettings();
  }
  $('h-title').textContent = c.title;
  $('st').className = 'status ' + (c.open ? 'on' : 'off');
  $('st').innerHTML = `<span class="dot"></span>${c.open ? 'Приём оценок открыт' : 'Приём оценок закрыт'}`;
  $('toggle').textContent = c.open ? 'Закрыть приём' : 'Открыть приём';
  $('cur').innerHTML = [['', 'Никто (показывать список)'], ...c.presentations.map(p => [p, p])]
    .map(([v, t]) => `<button class="chip" data-v="${esc(v)}" aria-pressed="${c.current === v}">${esc(t)}</button>`).join('');
  $('cur').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => save({current: b.dataset.v})));
  if (!editing) fillSettings();

  $('stats').textContent = `${r.total_votes} оценок от ${r.voters} человек · обновляется само`;
  const f = x => x == null ? '—' : x.toFixed(2).replace('.', ',');
  let place = 0, prev = null;
  $('tbl').innerHTML = `<thead><tr><th>Место</th><th>Презентация</th><th>Голосов</th>${r.criteria.map(n => `<th>${esc(n)}</th>`).join('')}<th>Средний балл</th></tr></thead>
    <tbody>${r.rows.map((row, i) => {
      if (row.total != null && f(row.total) !== prev){ place = i + 1; prev = f(row.total); }
      const pl = row.total == null ? '—' : place;
      return `<tr class="${pl === 1 ? 'top1' : ''}"><td><span class="place">${pl}</span></td><td>${esc(row.name)}${row.removed ? ' <span class="small muted">(удалена из списка)</span>' : ''}</td><td>${row.votes}</td>${row.avgs.map(a => `<td>${f(a)}</td>`).join('')}<td class="total">${f(row.total)}<span class="meter"><i style="width:${row.total ? row.total / c.scale * 100 : 0}%"></i></span></td></tr>`;
    }).join('')}</tbody>`;
  const withC = r.rows.filter(x => x.comments.length);
  const openNow = [...document.querySelectorAll('#comments details[open]')].map(d => d.dataset.n);
  $('comments').innerHTML = withC.map(x => `<details data-n="${esc(x.name)}" ${openNow.includes(x.name) ? 'open' : ''}><summary>Комментарии: ${esc(x.name)} (${x.comments.length})</summary>${x.comments.map(cm => `<div class="cm">${esc(cm.text)}</div>`).join('')}</details>`).join('');
  if (!$('stage').hidden) $('stage-now').textContent = c.current ? 'Сейчас: ' + c.current : '';
  renderCharts(c, r);
}

/* ---------- Графики ---------- */
const fmt = x => x == null ? '—' : x.toFixed(2).replace('.', ',');
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
function bins(dist, scale){
  if (scale <= 5) return dist.map((n, i) => ({label: String(i + 1), n}));
  const out = [];
  for (let i = 0; i < dist.length; i += 2) out.push({label: (i + 1) + '–' + (i + 2), n: dist[i] + (dist[i + 1] || 0)});
  return out;
}
function renderCharts(c, r){
  const box = $('charts');
  const rows = r.rows.filter(x => x.votes > 0);
  if (!rows.length){ box.innerHTML = '<p class="empty">Графики появятся после первых оценок.</p>'; return; }
  const S = c.scale;

  // 1. Средний балл
  const bars = `<div class="chart"><h3>Средний балл</h3><p class="sub">По всем критериям, шкала 0–${S}</p>
    <div class="hbars" style="--ticks:${S}">${rows.map(x => `
      <span class="nm">${esc(x.name)}</span>
      <span class="tr" data-tip="${esc(x.name)}: ${fmt(x.total)} из ${S} · голосов: ${x.votes}"><i style="width:${x.total / S * 100}%"></i></span>
      <span class="vl">${fmt(x.total)}</span>`).join('')}
      <span class="ax">${Array.from({length: S + 1}, (_, k) => k).filter(k => S <= 5 || k % 2 === 0).map(k => `<span style="left:${k / S * 100}%">${k}</span>`).join('')}</span></div></div>`;

  // 2. Тепловая карта критериев
  const best = r.criteria.map((_, k) => Math.max(...rows.map(x => x.avgs[k] ?? -1)));
  const all = rows.flatMap(x => x.avgs).filter(a => a != null);
  let lo = Math.min(...all), hi = Math.max(...all);
  if (hi - lo < 0.5){ const m = (hi + lo) / 2; lo = Math.max(1, m - 0.25); hi = Math.min(S, m + 0.25); if (hi - lo < 0.01){ lo = 1; hi = S; } }
  const heat = `<div class="chart"><h3>Сильные и слабые стороны</h3><p class="sub">Средняя оценка по критериям: чем темнее, тем выше. Рамкой — лучшая в критерии.</p>
    <div class="heat"><table><thead><tr><th>Презентация</th>${r.criteria.map(n => `<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(x => `<tr><td>${esc(x.name)}</td>${x.avgs.map((a, k) => {
      if (a == null) return '<td>—</td>';
      const p = Math.round(8 + Math.min(1, Math.max(0, (a - lo) / (hi - lo))) * 87);
      const ink = p > 55 ? 'var(--accent-ink)' : 'var(--ink)';
      return `<td class="${a === best[k] ? 'best' : ''}" style="background:color-mix(in oklab,var(--accent) ${p}%,var(--surface));color:${ink}" data-tip="${esc(x.name)} · ${esc(r.criteria[k])}: ${fmt(a)}">${fmt(a)}</td>`;
    }).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="ramp"><span>${fmt(lo)}</span><span class="g"></span><span>${fmt(hi)}</span></div></div>`;

  // 3. Распределение оценок
  const cols = ['--d1','--d2','--d3','--d4','--d5'];
  const dist = `<div class="chart"><h3>Как распределились оценки</h3><p class="sub">Доля каждой оценки среди всех оценок презентации</p>
    <div class="dist">${rows.map(x => {
      const b = bins(x.dist, S), tot = b.reduce((a, y) => a + y.n, 0);
      return `<span class="nm">${esc(x.name)}</span><span class="st">${b.map((y, i) => y.n ? `<i style="flex:${y.n};background:var(${cols[i]})" data-tip="${esc(x.name)} · оценка ${y.label}: ${y.n} (${pct(y.n, tot)}%)"></i>` : '').join('')}</span>`;
    }).join('')}</div>
    <div class="legend">${bins(Array(S).fill(0), S).map((y, i) => `<span><b style="background:var(${cols[i]})"></b>${y.label}</span>`).join('')}</div></div>`;

  // 4. Активность
  const t = r.times;
  let act = '<div class="chart"><h3>Активность</h3><p class="empty">Нет данных</p></div>';
  if (t.length){
    const start = Math.floor(t[0] / 60) * 60, end = Math.max(r.now, t[t.length - 1]);
    const span = Math.max(1, Math.ceil((end - start + 1) / 60));
    const step = Math.max(1, Math.ceil(span / 40));
    const n = Math.ceil(span / step), buckets = Array(n).fill(0);
    t.forEach(x => { const i = Math.min(n - 1, Math.floor((x - start) / 60 / step)); buckets[i]++; });
    const mx = Math.max(...buckets);
    const hm = s => new Date(s * 1000).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
    act = `<div class="chart"><h3>Активность</h3><p class="sub">Оценок за ${step === 1 ? 'минуту' : step + ' мин'} · максимум ${mx}</p>
      <div class="cols">${buckets.map((v, i) => `<i class="${v ? '' : 'z'}" style="height:${v / mx * 100}%" data-tip="${hm(start + i * step * 60)}: ${v} оцен${v % 10 === 1 && v % 100 !== 11 ? 'ка' : (v % 10 >= 2 && v % 10 <= 4 && (v % 100 < 10 || v % 100 >= 20)) ? 'ки' : 'ок'}"></i>`).join('')}</div>
      <div class="cols-ax"><span>${hm(start)}</span><span>${hm(end)}</span></div></div>`;
  }
  box.innerHTML = bars + heat + dist + act;
}

// Подсказки при наведении
const tip = $('tip');
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (!el){ tip.hidden = true; return; } tip.textContent = el.dataset.tip; tip.hidden = false; });
document.addEventListener('mousemove', e => { if (tip.hidden) return; const w = tip.offsetWidth; tip.style.left = Math.min(innerWidth - w - 8, e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 16) + 'px'; });

/* ---------- Итоги на экран ---------- */
let podiumRows = [], shown = 0;
function openPodium(){
  const r = data.results, S = data.config.scale;
  podiumRows = r.rows.filter(x => x.votes > 0);
  shown = 0;
  $('pd-title').textContent = 'Итоги голосования';
  let place = 0, prev = null;
  $('pd-list').innerHTML = podiumRows.slice(0, 10).map((x, i) => {
    if (fmt(x.total) !== prev){ place = i + 1; prev = fmt(x.total); }
    return `<div class="pr hid ${place === 1 ? 'first' : ''}" data-w="${x.total / S * 100}"><span class="pn">${place}</span><span class="nm">${esc(x.name)}</span><span class="tr"><i></i></span><span class="vl">${fmt(x.total)}</span></div>`;
  }).join('') || '<p>Пока нет оценок.</p>';
  $('podium').hidden = false;
  document.documentElement.requestFullscreen?.().catch(() => {});
  $('pd-next').hidden = $('pd-all').hidden = !podiumRows.length;
}
function revealNext(){
  const items = [...$('pd-list').querySelectorAll('.pr')];
  if (shown >= items.length) return false;
  const el = items[items.length - 1 - shown]; shown++;
  el.classList.remove('hid');
  requestAnimationFrame(() => requestAnimationFrame(() => { el.querySelector('i').style.width = el.dataset.w + '%'; }));
  if (shown >= items.length) $('pd-next').hidden = $('pd-all').hidden = true;
  return shown < items.length;
}
function closePodium(){ $('podium').hidden = true; if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {}); }

function fillSettings(){
  const c = data.config;
  $('s-title').value = c.title;
  $('s-pres').value = c.presentations.join('\n');
  $('s-crit').value = c.criteria.map(x => x.desc ? `${x.name} — ${x.desc}` : x.name).join('\n');
  $('s-scale').value = String(c.scale);
  $('s-comments').checked = c.comments;
}
async function save(patch){
  try { const d = await api('/api/admin/config', patch); data.config = d.config; render(); }
  catch(e){ toast(e.message === 'bad_key' ? 'Неверный ключ' : 'Не удалось сохранить'); }
}
function showStage(){
  $('stage-title').textContent = data.config.title;
  $('stage-now').textContent = data.config.current ? 'Сейчас: ' + data.config.current : '';
  $('stage-qr').src = qrSrc(voteUrl, 1200);
  $('stage-url').textContent = voteUrl.replace(/^https?:\/\//, '').replace(/\/$/, '');
  $('stage').hidden = false;
  document.documentElement.requestFullscreen?.().catch(() => {});
}
function closeStage(){ $('stage').hidden = true; if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {}); }

function start(){ app.innerHTML = '<p class="muted">Загрузка…</p>'; refresh(); clearInterval(timer); timer = setInterval(refresh, 4000); }
if (key) start(); else gate('');
})();
</script>
