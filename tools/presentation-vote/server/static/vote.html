<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Оценка презентаций</title>
<style>
:root{
  --bg:#F3F4EF; --surface:#FFFFFF; --ink:#17191B; --muted:#5D6460; --line:#D9DCD3;
  --accent:#1D6B57; --accent-ink:#FFFFFF; --soft:#E7EEE9; --mark:#FFD84D; --mark-ink:#17191B; --bad:#B3261E;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121514; --surface:#1A1E1C; --ink:#ECEFEA; --muted:#9BA39E; --line:#2D3330;
  --accent:#4FBF9F; --accent-ink:#0D1412; --soft:#203029; --mark:#F2CC45; --mark-ink:#17191B; --bad:#FF8A80;
  color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(110px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:24px;line-height:1.2;margin:4px 0 0;text-wrap:balance}
h2{font-size:19px;line-height:1.25;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.list{display:flex;flex-direction:column;gap:8px}
.pres{appearance:none;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);
  border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center;cursor:pointer;min-height:56px}
.pres .name{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.pres .tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pres .tag.now{background:var(--mark);color:var(--mark-ink)}
.pres .tag.done{background:var(--soft);color:var(--accent)}
.pres.current{border-color:var(--accent)}
.crit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.crit.missing{border-color:var(--bad)}
.crit .cname{font-weight:600}
.crit .cdesc{font-size:14px;color:var(--muted);margin-top:-6px}
.scale{display:grid;gap:6px}
.scale button{appearance:none;font:600 18px/1 system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);
  border-radius:10px;height:48px;cursor:pointer;font-variant-numeric:tabular-nums}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:90px;resize:vertical}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.btn{appearance:none;font:600 16px system-ui,sans-serif;border-radius:12px;padding:0 18px;height:52px;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{flex:1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:default}
.back{appearance:none;background:none;border:0;color:var(--accent);font:inherit;padding:0;cursor:pointer;align-self:flex-start}
.center{text-align:center;padding:48px 0 0;display:flex;flex-direction:column;gap:12px;align-items:center}
.big{font-size:56px;line-height:1}
.err{color:var(--bad);font-size:14px}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Загрузка…</p></div>
<div class="bar" id="bar" hidden><div class="in" id="bar-in"></div></div>
<script>
(() => {
const app = document.getElementById('app'), bar = document.getElementById('bar'), barIn = document.getElementById('bar-in');
let cfg = null, sel = null, scores = {}, comment = '', sending = false, error = '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load(){
  try {
    const r = await fetch('/api/config', {cache:'no-store', credentials:'same-origin'});
    cfg = await r.json();
  } catch(e){ app.innerHTML = '<div class="center"><h2>Нет связи с сервером</h2><p class="muted">Проверьте интернет и обновите страницу.</p></div>'; return; }
  document.title = cfg.title;
  if (cfg.current && !cfg.mine[cfg.current] && cfg.open) open(cfg.current); else list();
}

function list(){
  sel = null; window.scrollTo(0,0);
  if (!cfg.open){ bar.hidden = true; app.innerHTML = `<div class="center"><h2>Голосование закрыто</h2><p class="muted">Спасибо за участие!</p></div>`; return; }
  if (!cfg.presentations.length){ bar.hidden = true; app.innerHTML = `<h1>${esc(cfg.title)}</h1><p class="muted">Презентации ещё не добавлены. Обновите страницу чуть позже.</p>`; return; }
  const done = Object.keys(cfg.mine).filter(p => cfg.presentations.includes(p)).length;
  app.innerHTML = `
    <h1>${esc(cfg.title)}</h1>
    <p class="muted">Выберите презентацию, которую хотите оценить.${done ? ` Оценено: ${done} из ${cfg.presentations.length}.` : ''}</p>
    <div class="list">${cfg.presentations.map((p,i) => `
      <button class="pres${p === cfg.current ? ' current' : ''}" data-i="${i}">
        <span class="name">${esc(p)}</span>
        ${p === cfg.current ? '<span class="tag now">Сейчас</span>' : ''}
        ${cfg.mine[p] ? '<span class="tag done">✓ Оценено</span>' : ''}
      </button>`).join('')}</div>`;
  app.querySelectorAll('.pres').forEach(b => b.addEventListener('click', () => open(cfg.presentations[+b.dataset.i])));
  bar.hidden = true;
}

function open(p){
  sel = p; error = '';
  const prev = cfg.mine[p];
  scores = prev ? {...prev.scores} : {};
  comment = prev ? prev.comment : '';
  rate(); window.scrollTo(0,0);
}

function rate(){
  const n = cfg.scale;
  app.innerHTML = `
    ${cfg.presentations.length > 1 ? '<button class="back" id="back">← Все презентации</button>' : ''}
    <div><p class="muted small">Вы оцениваете</p><h2>${esc(sel)}</h2></div>
    ${cfg.mine[sel] ? '<p class="muted small">Вы уже оценивали эту презентацию — новые оценки заменят прежние.</p>' : ''}
    ${cfg.criteria.map((c,i) => `
      <div class="crit" id="c${i}">
        <div class="cname">${esc(c.name)}</div>
        ${c.desc ? `<div class="cdesc">${esc(c.desc)}</div>` : ''}
        <div class="scale" style="grid-template-columns:repeat(${Math.min(n,5)},1fr)">
          ${Array.from({length:n},(_,k)=>k+1).map(v => `<button data-c="${i}" data-v="${v}" aria-pressed="${scores[c.name]===v}" aria-label="${esc(c.name)}: ${v}">${v}</button>`).join('')}
        </div>
        <div class="ends"><span>1 — слабо</span><span>${n} — отлично</span></div>
      </div>`).join('')}
    ${cfg.comments ? `<label class="small muted" for="cm">Комментарий (необязательно)</label><textarea id="cm" maxlength="1000" placeholder="Что понравилось или что улучшить?">${esc(comment)}</textarea>` : ''}
    ${error ? `<p class="err">${esc(error)}</p>` : ''}`;
  const back = document.getElementById('back'); if (back) back.addEventListener('click', list);
  app.querySelectorAll('.scale button').forEach(b => b.addEventListener('click', () => {
    const c = cfg.criteria[+b.dataset.c]; scores[c.name] = +b.dataset.v;
    b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    b.closest('.crit').classList.remove('missing'); updateBar();
  }));
  const cm = document.getElementById('cm'); if (cm) cm.addEventListener('input', () => comment = cm.value);
  bar.hidden = false; updateBar();
}

function updateBar(){
  const left = cfg.criteria.filter(c => !scores[c.name]).length;
  barIn.innerHTML = `<button class="btn primary" id="send" ${sending ? 'disabled' : ''}>${sending ? 'Отправляю…' : left ? `Осталось оценить: ${left}` : 'Отправить'}</button>`;
  document.getElementById('send').addEventListener('click', send);
}

async function send(){
  const missing = cfg.criteria.findIndex(c => !scores[c.name]);
  if (missing >= 0){ const el = document.getElementById('c'+missing); el.classList.add('missing'); el.scrollIntoView({behavior:'smooth', block:'center'}); return; }
  sending = true; updateBar();
  try {
    const r = await fetch('/api/vote', {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({presentation: sel, scores, comment})});
    const d = await r.json();
    sending = false;
    if (r.ok){ cfg.mine[sel] = {scores:{...scores}, comment}; done(); return; }
    if (d.error === 'closed'){ cfg.open = false; list(); return; }
    error = d.error === 'unknown_presentation' ? 'Эту презентацию убрали из списка. Вернитесь к списку.' : 'Не получилось отправить. Попробуйте ещё раз.';
    rate();
  } catch(e){ sending = false; error = 'Нет связи с сервером. Проверьте интернет и нажмите «Отправить» ещё раз.'; rate(); }
}

function done(){
  window.scrollTo(0,0);
  const left = cfg.presentations.filter(p => !cfg.mine[p]);
  app.innerHTML = `<div class="center"><div class="big">✓</div><h2>Спасибо, оценки приняты!</h2>
    <p class="muted">${left.length ? `Осталось оценить: ${left.length}.` : 'Вы оценили все презентации.'}</p></div>`;
  barIn.innerHTML = `<button class="btn primary" id="more">${left.length ? 'Оценить другую презентацию' : 'К списку презентаций'}</button>`;
  document.getElementById('more').addEventListener('click', load);
  bar.hidden = false;
}

load();
})();
</script>
</body>
</html>
